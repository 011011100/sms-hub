name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check OTP extraction
        run: |
          mkdir -p android/build/test
          javac -encoding UTF-8 -d android/build/test android/src/com/smshub/app/Otp.java android/test/OtpTest.java
          java -cp android/build/test OtpTest
      - name: Build APK
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sms-hub-apk-ci
          path: android/build/sms-hub-0.1.0.apk
